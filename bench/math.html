<!doctype html><html lang="ru"><meta charset="utf-8"><link rel="icon" href="/favicon.svg"><title>Vector PNI — math benchmark</title><body><pre id="result">Developer benchmark. Call runVectorMathBenchmark() from the browser test.</pre><script type="module">
import {springTo} from '../viewer-motion.js';
const count=23,frames=200000,rounds=5;
const makeStates=()=>Array.from({length:count},(_,i)=>({value:0,velocity:0,speed:i===0?12:i<17?16:13}));
const target=(frame,i)=>((Math.floor(frame/30)+i)%2);
const summarize=values=>({roundMs:values,medianMs:[...values].sort((a,b)=>a-b)[Math.floor(values.length/2)],frames,statesPerFrame:count});
window.runVectorMathBenchmark=async({wasm=false}={})=>{
 function jsTrial(n){const states=makeStates(),start=performance.now();for(let f=0;f<n;f++)for(let i=0;i<count;i++)springTo(states[i],target(f,i),1/(58+f%7),states[i].speed);return {ms:performance.now()-start,states};}
 jsTrial(10000);const js=[],checksums=[];for(let r=0;r<rounds;r++){const trial=jsTrial(frames);js.push(trial.ms);checksums.push(trial.states.reduce((sum,s)=>sum+s.value+s.velocity,0));}const result={javascript:{...summarize(js),checksums},wasm:{status:'not requested / Emscripten module not built'}};
 result.javascript.microsecondsPerFrame=result.javascript.medianMs*1000/frames;
 if(wasm){const start=performance.now();const create=(await import(/* @vite-ignore */ new URL('./spring-kernel.js',import.meta.url).href)).default,module=await create();const setupMs=performance.now()-start,pointer=module._malloc(count*4*8),data=new Float64Array(module.HEAPF64.buffer,pointer,count*4);const reset=()=>{data.fill(0);for(let i=0;i<count;i++)data[i*4+3]=i===0?12:i<17?16:13;};const step=f=>{for(let i=0;i<count;i++)data[i*4+2]=target(f,i);module._step_batch(pointer,count,1/(58+f%7));};
 try{reset();for(let f=0;f<500;f++)step(f);const reference=jsTrial(500).states;for(let i=0;i<count;i++)if(Math.abs(data[i*4]-reference[i].value)>1e-9||Math.abs(data[i*4+1]-reference[i].velocity)>1e-9)throw Error('Kernel parity failed');const values=[];for(let r=0;r<rounds;r++){reset();const t=performance.now();for(let f=0;f<frames;f++)step(f);values.push(performance.now()-t);}result.wasm={status:'measured',...summarize(values),setupMs,workingStateBytes:count*4*8,linearMemoryBytes:module.HEAPF64.buffer.byteLength};}finally{module._free(pointer);}}
 document.getElementById('result').textContent=JSON.stringify(result,null,2);return result;
};
</script></body></html>
